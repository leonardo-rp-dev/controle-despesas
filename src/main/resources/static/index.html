<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Controle de Despesas</title>
    <link rel="stylesheet" href="css/estilo.css">
    <script src="js/app.js"></script>
    <script defer src="js/alpine.min.js"></script>
</head>
<body>
    <main x-data="despesas()" x-init="carregar()">
        <h1>Controle de Despesas</h1>

        <section aria-labelledby="titulo-cadastro">
            <h2 id="titulo-cadastro" x-text="editandoId !== null ? 'Editar despesa' : 'Nova despesa'"></h2>
            <form @submit.prevent="salvar()" novalidate>
                <label>
                    Descrição
                    <input type="text" x-model="form.descricao" autocomplete="off">
                </label>
                <label>
                    Valor (R$)
                    <input type="text" inputmode="decimal" placeholder="12,34" x-model="form.valor" autocomplete="off">
                </label>
                <label>
                    Data
                    <input type="date" x-model="form.data">
                </label>
                <div class="botoes">
                    <button type="submit" :disabled="salvando">
                        <span x-text="salvando ? 'Salvando...' : (editandoId !== null ? 'Atualizar' : 'Salvar')"></span>
                    </button>
                    <button type="button" class="secundario" x-show="editandoId !== null" @click="cancelar()" :disabled="salvando">
                        Cancelar
                    </button>
                </div>
            </form>
            <p class="erro" role="alert" x-show="erro" x-text="erro"></p>
        </section>

        <section aria-labelledby="titulo-lista">
            <h2 id="titulo-lista">Despesas</h2>
            <div class="filtro">
                <label>
                    Mês
                    <input type="month" x-model="mes" @change="carregar()">
                </label>
                <button type="button" class="secundario" x-show="mes !== ''" @click="limparFiltro()">Limpar filtro</button>
            </div>
            <p class="total">
                <span x-text="rotuloTotal()"></span>:
                <strong x-text="total !== null ? formatarValor(total) : '-'"></strong>
            </p>
            <p x-show="carregando && lista.length === 0">Carregando...</p>
            <p x-show="!carregando && lista.length === 0 && !erroLista && mes !== ''">Nenhuma despesa neste mês.</p>
            <p x-show="!carregando && lista.length === 0 && !erroLista && mes === ''">Nenhuma despesa cadastrada.</p>
            <p class="erro" role="alert" x-show="erroLista" x-text="erroLista"></p>
            <ul class="lista">
                <template x-for="d in lista" :key="d.id">
                    <li :class="{ 'em-edicao': d.id === editandoId }">
                        <div class="item-topo">
                            <span class="descricao" x-text="d.descricao"></span>
                            <strong x-text="formatarValor(d.valor)"></strong>
                        </div>
                        <div class="item-base">
                            <time x-text="formatarData(d.data)"></time>
                            <div class="acoes">
                                <button type="button" class="secundario" @click="editar(d)" :disabled="salvando || excluindoId !== null">Editar</button>
                                <button type="button" class="perigo" @click="excluir(d)" :disabled="salvando || excluindoId !== null">Excluir</button>
                            </div>
                        </div>
                    </li>
                </template>
            </ul>
        </section>
    </main>
</body>
</html>
